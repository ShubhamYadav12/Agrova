<span
  class="agrova-badge"
  [class.agrova-badge--default]="variant() === 'default'"
  [class.agrova-badge--success]="variant() === 'success'"
  [class.agrova-badge--warning]="variant() === 'warning'"
  [class.agrova-badge--danger]="variant() === 'danger'"
  [class.agrova-badge--info]="variant() === 'info'"
>
  {{ label() }}
</span>
