<section class="agrova-empty-state" role="status">
  @if (icon) {
    <div
      class="agrova-empty-state__icon"
      aria-hidden="true"
    >
      {{ icon }}
    </div>
  }

  <h2 class="agrova-empty-state__title">
    {{ title }}
  </h2>

  @if (message) {
    <p class="agrova-empty-state__message">
      {{ message }}
    </p>
  }

  @if (actionLabel) {
    <button
      type="button"
      class="agrova-empty-state__action"
      (click)="onAction()"
    >
      {{ actionLabel }}
    </button>
  }
</section>
